<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <title>Canva Insights</title>
  <link rel="stylesheet" href="ui.css">
  <style>body { width: 360px; padding: 12px; } header { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 10px; } header h1 { margin: 0; }</style>
</head>
<body>
  <header>
    <h1>Canva Insights</h1>
    <span id="conn" class="pill">…</span>
  </header>

  <section id="status" class="status" aria-live="polite">
    <h2><span class="dot" aria-hidden="true"></span><span id="status-title">Memuat…</span></h2>
    <p id="status-text" class="muted"></p>
    <div id="bar" class="bar" hidden><span id="bar-fill" style="width: 0%"></span></div>
    <p id="status-meta" class="muted"></p>
    <p id="status-hint" class="hint" hidden></p>
    <ol id="steps" class="steps" hidden></ol>
  </section>

  <div id="setup" class="box" hidden>
    <p>URL dashboard dan token belum diisi.</p>
    <button id="open-options" class="secondary">Buka Pengaturan</button>
  </div>
  <div id="not-dashboard" class="box" hidden>
    <p>Buka dashboard Creator Canva untuk akun brand yang ingin disinkronkan.</p>
    <button id="open-dashboard">Buka dashboard Creator</button>
  </div>
  <div id="ready" class="box" hidden>
    <label><input type="checkbox" id="backfill"> Ambil 365 hari (sinkron pertama brand ini, ±1 jam)</label>
    <button id="sync">Sinkronkan sekarang</button>
  </div>

  <div class="box">
    <p class="muted">Sinkron terakhir per brand</p>
    <table id="runs"></table>
  </div>

  <details>
    <summary>Log teknis</summary>
    <pre id="lines"></pre>
  </details>
  <script type="module" src="popup.js"></script>
</body>
</html>
